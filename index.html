<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpGuide Knowledge Base - Tech Tutorials & Guides</title>
    <meta name="description" content="Comprehensive knowledge base with latest tutorials and guides automatically updated from HelpGuide Blog.">
    <link rel="canonical" href="https://yourusername.github.io/helpguide">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">📚 HelpGuide Knowledge Base</h1>
            <p class="subtitle">Latest tutorials and technical guides</p>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Loading latest articles...</p>
            </div>
            
            <div class="posts-grid" id="postsGrid">
                <!-- Blog posts will be dynamically loaded here -->
            </div>

            <div class="error" id="error" style="display: none;">
                <p>Unable to load blog posts. Please refresh the page or check back later.</p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 HelpGuide Knowledge Base. Powered by Blogger RSS.</p>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
</body>
</html>
